<title>ServiYa — Prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  svg text { font-family: Inter, -apple-system, sans-serif !important; }
  body {
    margin: 0; padding: 24px;
    background: #FFFFFF;
    font-family: Inter, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { color: #0B2F35; font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #3D5459; font-size: 12px; margin: 0 0 18px; text-align:center; }
  .frame { position: relative; width: min(381px, 92vw); }
  .screen { display: none; }
  .screen.active { display: block; }
  .phone-frame {
    position: relative; width: 100%; aspect-ratio: 393 / 852;
    overflow: hidden; border-radius: 26px;
    box-shadow: 0 8px 30px rgba(11,47,53,0.25);
  }
  .phone-scroll {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    touch-action: pan-y;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .phone-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .phone-clip { position: relative; width: 100%; height: 0; overflow: hidden; }
  .phone-clip .phone-wrap { position: absolute; top: 0; left: 0; }
  .phone-wrap { position: relative; width: 100%; }
  .phone-wrap svg { width: 100%; height: auto; display: block; }
  .phone-navbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 8.7169%;
    overflow: hidden; background: #FFFFFF; z-index: 5;
  }
  .phone-navbar-inner { position: relative; width: 100%; }
  .phone-navbar-inner svg { width: 100%; height: auto; display: block; }
  .hot {
    position: absolute; cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.08); touch-action: manipulation;
    /* background: rgba(255,0,0,0.15); uncomment to debug hotspots */
  }
  input.date-input, input.time-input {
    position: absolute; box-sizing: border-box;
    border: none; outline: none; background: transparent;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 12px; font-weight: 700; color: #0B2F35;
    padding: 0; cursor: pointer;
  }
  .pay-option {
    position: absolute; box-sizing: border-box;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-radius: 12px; cursor: pointer;
    background: #FFFFFF; border: 1.5px solid #E6E9EC;
    -webkit-tap-highlight-color: rgba(0,0,0,0.08); touch-action: manipulation;
  }
  .pay-option.selected { background: #E8F8F1; border-color: #2CC18F; }
  .pay-emoji { font-size: 14px; line-height: 1; }
  .pay-label { font-family: Inter, -apple-system, sans-serif; font-size: 12px; font-weight: 700; color: #0B2F35; }
</style>
</head>

<script>
  let stack = ['login'];
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('screen-' + id);
    if (el) el.classList.add('active');
    window.scrollTo(0, 0);
    const scrollEl = el && el.querySelector('.phone-scroll');
    if (scrollEl) scrollEl.scrollTop = 0;
  }
  function go(id) {
    if (!document.getElementById('screen-' + id)) return;
    stack.push(id);
    show(id);
  }
  function goBack() {
    if (stack.length > 1) stack.pop();
    show(stack[stack.length - 1]);
  }
  function handleHot(e) {
    const hot = e.target.closest('.hot');
    if (!hot) return;
    e.preventDefault();
    if (hot.dataset.back) {
      goBack();
    } else if (hot.dataset.target) {
      go(hot.dataset.target);
    }
  }
  function handlePay(e) {
    const opt = e.target.closest('.pay-option');
    if (!opt) return;
    const group = opt.dataset.group;
    document.querySelectorAll('.pay-option[data-group="' + group + '"]').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
  }
  const frame = document.getElementById('frame');
  frame.addEventListener('click', handleHot);
  frame.addEventListener('click', handlePay);
  frame.addEventListener('touchend', handleHot, { passive: false });
  document.querySelectorAll('input.date-input').forEach(inp => {
    const t = new Date(); t.setDate(t.getDate());
    inp.value = t.toISOString().slice(0, 10);
    inp.addEventListener('click', () => { if (inp.showPicker) { try { inp.showPicker(); } catch (e) {} } });
  });
  document.querySelectorAll('input.time-input').forEach(inp => {
    const t = new Date();
    inp.value = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    inp.addEventListener('click', () => { if (inp.showPicker) { try { inp.showPicker(); } catch (e) {} } });
  });
  show(stack[0]);
</script>
